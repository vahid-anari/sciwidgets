[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sciwidgets"
version = "0.15.3"
description = "PySide6 widgets for scientific desktop apps: LaTeX labels, sliders, parameter panels, Matplotlib plot canvas, DataFrame tables and dialogs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vahid Anari", email = "vahid.anari8@gmail.com" }]
keywords = [
    "pyside6", "qt", "gui", "widgets", "scientific",
    "slider", "range-slider", "latex", "matplotlib", "dialogs",
    "status-bar", "menu",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    # PySide6 6.12.0 loses a reference to None each time a Python table model returns None from data();
    # on Python before 3.12 (where None is not immortal) that crashes the interpreter
    "PySide6>=6.5,<7; python_version >= '3.12'",
    "PySide6>=6.5,<7,!=6.12.0; python_version < '3.12'",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "psutil>=5.9",
    "certifi",  # HTTPS certificates for the update check (python.org's macOS Python has none by itself)
]

[project.optional-dependencies]
table = ["pandas>=2.0"]
dev = ["build", "twine", "pytest", "pandas>=2.0", "pyobjc-framework-Quartz; sys_platform == 'darwin'"]

[project.urls]
Homepage = "https://github.com/vahid-anari/sciwidgets"
Repository = "https://github.com/vahid-anari/sciwidgets"
Issues = "https://github.com/vahid-anari/sciwidgets/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.svg", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
